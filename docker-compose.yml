# Settings come from .env next to this file (see .env.example).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: darkroom-server
    restart: unless-stopped
    # Run as your user so uploaded photos belong to you on the host.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ACCESS_KEY: ${ACCESS_KEY:-}
      SERVER_NAME: ${SERVER_NAME:-darkroom}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-phone}
    volumes:
      - ${PHOTOS_DIR:-./photos}:/photos
      - ${DATA_DIR:-./data}:/data
