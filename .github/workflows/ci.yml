name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the server container
        run: |
          mkdir -p photos data
          PUID=$(id -u) PGID=$(id -g) docker compose up -d --build
      - name: Check it answers
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs server
          exit 1
      - if: always()
        run: docker compose logs server

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: darkroom-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
